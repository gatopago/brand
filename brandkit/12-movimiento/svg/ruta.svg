<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 160" role="img" aria-labelledby="motion-title-ruta motion-desc-ruta"><title id="motion-title-ruta">El camino</title><desc id="motion-desc-ruta">Preparación indeterminada: no representa porcentaje ni liquidación.</desc><style>.packet{animation:travel 2.4s cubic-bezier(.45,0,.25,1) infinite}@keyframes travel{0%{transform:translateX(0);opacity:0}5%,10%{transform:translateX(0);opacity:1}80%,92%{transform:translateX(256px);opacity:1}97%{transform:translateX(256px);opacity:0}100%{transform:translateX(0);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.packet{transform:translateX(128px);opacity:1}}</style><path d="M24 80H280" stroke="#eee4d8" stroke-width="4"/><path d="M24 80H280" stroke="#0b0b0f" stroke-width="2" stroke-dasharray="8 8"/><g class="packet"><rect x="16" y="72" width="16" height="16" fill="#f85239"/><rect x="20" y="76" width="8" height="8" fill="#0b0b0f"/></g></svg>