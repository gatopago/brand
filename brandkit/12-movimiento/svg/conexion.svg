<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 160" role="img" aria-labelledby="motion-title-conexion motion-desc-conexion"><title id="motion-title-conexion">Puntos conectados</title><desc id="motion-desc-conexion">Exploración de ruta; el destino solo se confirma con datos reales.</desc><style>.trace{stroke-dasharray:312;animation:draw 2.8s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:312;opacity:0}5%,10%{stroke-dashoffset:312;opacity:1}75%,90%{stroke-dashoffset:0;opacity:1}97%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:312;opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.trace{stroke-dasharray:none;opacity:1}}</style><path d="M48 104V48H248V104" fill="none" stroke="#eee4d8" stroke-width="4"/><path class="trace" d="M48 104V48H248V104" fill="none" stroke="#f85239" stroke-width="4"/><rect x="40" y="96" width="16" height="16" fill="#0b0b0f"/><rect x="240" y="96" width="16" height="16" fill="#0b0b0f"/></svg>