<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 160" role="img" aria-labelledby="motion-title-espera motion-desc-espera"><title id="motion-title-espera">Pulso discreto</title><desc id="motion-desc-espera">Espera sin tiempo estimado: un pulso de opacidad, sin parpadeos rápidos.</desc><style>.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.pulse{opacity:1}}</style><rect x="144" y="72" width="16" height="16" fill="#f85239" class="pulse"/><rect x="112" y="76" width="8" height="8" fill="#eee4d8"/><rect x="184" y="76" width="8" height="8" fill="#eee4d8"/></svg>