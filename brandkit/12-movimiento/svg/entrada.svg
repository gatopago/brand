<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 160" role="img" aria-labelledby="motion-title-entrada motion-desc-entrada"><title id="motion-title-entrada">Aparecer sin ruido</title><desc id="motion-desc-entrada">Entrada de tarjeta, una vez. Sin rebotes ni desplazamientos de layout.</desc><style>.card{animation:enter .28s cubic-bezier(.2,.7,.2,1) both}@keyframes enter{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.card{transform:none;opacity:1}}</style><g class="card"><rect x="64" y="40" width="180" height="88" fill="#eee4d8"/><rect x="60" y="36" width="180" height="88" fill="#fffdf9" stroke="#0b0b0f" stroke-width="2"/><rect x="76" y="52" width="24" height="24" fill="#f85239"/><path d="M116 58h100M116 70h64M76 98h140" stroke="#0b0b0f" stroke-width="2"/></g></svg>