<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 160" role="img" aria-labelledby="motion-title-intercambio motion-desc-intercambio"><title id="motion-title-intercambio">Dos trayectos</title><desc id="motion-desc-intercambio">Ejemplo visual de cambiar; no indica una tasa ni ejecución.</desc><style>.out,.back{animation:exchange 2.6s cubic-bezier(.4,0,.2,1) infinite}.back{animation-name:return}@keyframes exchange{0%{transform:translateX(0);opacity:0}5%,15%{transform:translateX(0);opacity:1}80%,92%{transform:translateX(176px);opacity:1}97%{transform:translateX(176px);opacity:0}100%{transform:translateX(0);opacity:0}}@keyframes return{0%{transform:translateX(0);opacity:0}5%,15%{transform:translateX(0);opacity:1}80%,92%{transform:translateX(-176px);opacity:1}97%{transform:translateX(-176px);opacity:0}100%{transform:translateX(0);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.out{transform:translateX(88px);opacity:1}.back{transform:translateX(-88px);opacity:1}}</style><path d="M64 60H240M64 100H240" stroke="#eee4d8" stroke-width="2"/><g class="out"><rect x="56" y="52" width="16" height="16" fill="#f85239"/></g><g class="back"><rect x="232" y="92" width="16" height="16" fill="#0b0b0f"/></g><path d="m232 52 8 8-8 8M72 92l-8 8 8 8" stroke="#0b0b0f" stroke-width="2" fill="none"/></svg>